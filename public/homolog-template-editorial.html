<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HML — Editorial Casa · template de loja virtual</title>
<meta name="description" content="Cerâmica, linho, madeira e aromas em pequenos lotes. Uma curadoria de objetos autorais para deixar a casa com a sua cara.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#b4552d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/templates-hml.css">
</head>
<body data-template="editorial-hml">

<header class="cx-topo">
  <a class="cx-voltar" href="homolog-templates.html" aria-label="Voltar para a galeria de modelos"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg><span>Modelos</span></a>
  <div class="cx-titulo"><b id="cxNomeModelo">Editorial Casa</b><span id="cxMetaModelo">HML · loja-conceito e storytelling</span></div>
  <label class="cx-modelo">Modelo <select id="cxModelo" aria-label="Trocar de modelo"><option value="vitrine-hml">Vitrine Express</option><option value="editorial-hml" selected>Editorial Casa</option><option value="boutique-hml">Boutique Noir</option></select></label>
  <div class="cx-dispositivos" role="group" aria-label="Visualizar em">
    <button type="button" data-device="desktop" aria-pressed="true" aria-label="Visualizar em desktop"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
    <button type="button" data-device="tablet" aria-pressed="false" aria-label="Visualizar em tablet"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M11 18h2"/></svg></button>
    <button type="button" data-device="mobile" aria-pressed="false" aria-label="Visualizar em celular"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></button>
  </div>
  <div class="cx-acoes">
    <button class="cx-btn" type="button" id="cxSalvar"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h12l3 3v13H5z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg><span>Salvar</span></button>
    <button class="cx-btn" type="button" id="cxExportar"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 20h14"/></svg><span>Exportar</span></button>
    <button class="cx-btn perigo" type="button" id="cxReset"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v5h5"/></svg><span>Restaurar</span></button>
    <a class="cx-btn primario" href="?standalone=1" target="_blank" rel="noopener"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9"/><path d="M20 14v6H4V4h6"/></svg><span>Ver loja</span></a>
  </div>
</header>

<div class="cx-wrap">
  <aside class="cx-painel" id="cxPainel" aria-label="Personalização do modelo">
    <div class="cx-abas" role="group" aria-label="Abas do editor">
      <button type="button" data-aba="secoes" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg>Seções</button>
      <button type="button" data-aba="conteudo" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6h14M12 6v13M8 19h8"/></svg>Conteúdo</button>
      <button type="button" data-aba="tema" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-.8 2-1.8 0-1.2-1-1.6-1-2.7 0-.8.7-1.5 1.6-1.5H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="10" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="14" cy="7" r="1"/><circle cx="17" cy="10" r="1"/></svg>Tema</button>
      <button class="cx-fechar" type="button" id="cxFechar" aria-label="Fechar painel"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="cx-corpo" id="cxCorpo"></div>
  </aside>

  <div class="cx-preview">
    <div class="cx-device is-desktop" id="cxDevice">
      <div class="cx-browser" aria-hidden="true">
        <span class="dots"><i></i><i></i><i></i></span>
        <span class="url" id="cxUrl">sualoja.com.br</span>
        <span class="lock">HML</span>
      </div>
      <div class="loja" id="loja" data-template="editorial-hml"></div>
    </div>
  </div>
</div>

<button class="cx-fab" type="button" id="cxFab"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Personalizar</button>

<script src="js/templates-hml-data.js"></script>
<script src="js/templates-hml.js"></script>
</body>
</html>
